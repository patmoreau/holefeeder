packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  browser-tabs-lock: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - expo-dev-client@57.0.9 || 58.0.14
  - expo-dev-launcher@57.0.9 || 58.0.14
  - expo-dev-menu@57.0.9
  - '@expo/cli@57.0.13 || 58.1.9 || 58.1.10 || 58.1.11'
  - '@expo/config-plugins@57.0.7'
  - babel-preset-expo@57.0.6 || 58.0.17
  - expo-asset@57.0.9
  - expo-file-system@57.0.2
  - expo-modules-core@57.0.10 || 58.0.21 || 58.0.22
  - expo@57.0.11 || 58.0.13 || 58.0.14
  - expo-build-properties@57.0.9 || 57.0.20 || 58.0.11
  - expo-router@57.0.11 || 58.0.22 || 58.0.23
  - expo-sharing@57.0.10 || 58.0.19
  - expo-symbols@57.0.2
  - '@expo/ui@58.0.20'
  - expo-crypto@58.0.7
  - expo-glass-effect@58.0.4
  - expo-haptics@58.0.7
  - expo-splash-screen@58.0.10
  - '@expo/schema-utils@58.0.2'
  - expo-modules-jsi@58.0.15
