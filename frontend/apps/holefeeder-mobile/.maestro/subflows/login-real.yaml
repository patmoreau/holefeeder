appId: com.drifterapps.holefeeder
name: Sign in through the real Auth0 Universal Login
---
# Drives the actual Auth0 hosted pages. Slow and network-dependent by nature —
# reserve for flows tagged `auth`. Everything else should get its session from
# the injected-token subflow instead.
#
# Requires MAESTRO_E2E_EMAIL / MAESTRO_E2E_PASSWORD (see .env.e2e.template).
- assertVisible:
    id: 'welcome-signin-button'
- tapOn:
    id: 'welcome-signin-button'

# iOS asks for consent before ASWebAuthenticationSession may share cookies with
# the identity provider. The sheet is a SpringBoard alert, not part of the app,
# and takes about a second to render — a `when: visible:` guard evaluates
# immediately and would skip it, so wait for it explicitly.
- extendedWaitUntil:
    visible: '.*Wants to Use.*to Sign In.*'
    timeout: 15000
- tapOn: 'Continue'

# clearKeychain does not touch Safari's cookie jar, which ASWebAuthenticationSession
# shares. So Auth0 may already have a session and jump straight to the consent
# screen instead of asking for credentials. Wait for whichever page we land on,
# then branch — a `when: visible:` guard is only reliable once the page has rendered.
- extendedWaitUntil:
    visible: '(Email address|Accept)'
    timeout: 30000

# Identifier-first login: email, then password, each behind its own Continue.
- runFlow:
    when:
      visible: 'Email address'
    commands:
      # Anchored: the page also offers "Continue with a passkey", which an
      # unanchored "Continue" matches first.
      # Submit with the return key rather than tapping Continue: the keyboard
      # covers the button and hideKeyboard does not shift the web layout, so a
      # tap lands on a key instead.
      - tapOn: 'Email address'
      - inputText: ${MAESTRO_E2E_EMAIL}
      - pressKey: Enter
      - extendedWaitUntil:
          visible: 'Password'
          timeout: 30000
      - tapOn: 'Password'
      - inputText: ${MAESTRO_E2E_PASSWORD}
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 8000
      # iOS offers to store the password in the keychain after a successful
      # submit. It only appears when the password is not already saved.
      - runFlow:
          when:
            visible: '.*Save Password.*'
          commands:
            - tapOn: 'Not Now'


# Auth0 offers to enrol a passkey on a device it has not seen before. Decline,
# so the account keeps working with the password these flows rely on.
- runFlow:
    when:
      visible: 'Continue without passkeys'
    commands:
      - tapOn: 'Continue without passkeys'
      - waitForAnimationToEnd:
          timeout: 8000

# Consent is asked once per user per app, so it is absent on later runs.
- runFlow:
    when:
      visible: 'Accept'
    commands:
      - tapOn: 'Accept'
