appId: com.drifterapps.holefeeder
name: Insights opens the income and spending details and comes back
tags:
  - regression
  - insights
---
- runFlow: ../../subflows/launch-clean.yaml
- runFlow: ../../subflows/login-injected.yaml
- extendedWaitUntil:
    visible:
      id: 'dashboard-screen'
    timeout: 60000

- tapOn:
    id: 'tabs-statistics'
- extendedWaitUntil:
    visible:
      id: 'insights-spending-link'
    timeout: 20000
- assertVisible:
    id: 'insights-net-header'
- assertVisible:
    id: 'insights-income-expense-chart'

- tapOn:
    id: 'insights-spending-link'
- extendedWaitUntil:
    visible:
      id: 'spending-screen'
    timeout: 20000
- assertVisible:
    id: 'spending-combined-toggle'

- tapOn:
    id: 'spending-back-button'
- extendedWaitUntil:
    visible:
      id: 'insights-screen'
    timeout: 20000

- tapOn:
    id: 'insights-income-link'
- extendedWaitUntil:
    visible:
      id: 'income-screen'
    timeout: 20000

- tapOn:
    id: 'income-back-button'
- extendedWaitUntil:
    visible:
      id: 'insights-screen'
    timeout: 20000
