appId: com.drifterapps.holefeeder
name: A new user sets their budget period before entering the app
tags:
  - onboarding
---
# NOT RUNNABLE YET — same blocker as gate.yaml and register.yaml: it needs the
# never-registered `e2e-new@…` user and a reset between runs.
- runFlow: ../../subflows/launch-clean.yaml

- assertVisible:
    id: 'welcome-screen'
- openLink: holefeeder://?e2e-auth-token=${MAESTRO_E2E_UNREGISTERED_TOKEN}

- runFlow:
    when:
      visible: '.*Open in .*'
    commands:
      - tapOn: '^Open$'

# Registering hands over to the budget period rather than opening the app.
- extendedWaitUntil:
    visible:
      id: 'onboarding-budget-period-screen'
    timeout: 90000
- assertNotVisible:
    id: 'dashboard-screen'

- tapOn:
    id: 'onboarding-budget-period-continue-button'

# Saving the period hands over to the first account rather than opening the app —
# reaching that screen is what proves the period was written.
- extendedWaitUntil:
    visible:
      id: 'onboarding-first-account-screen'
    timeout: 30000
- assertNotVisible:
    id: 'dashboard-screen'
