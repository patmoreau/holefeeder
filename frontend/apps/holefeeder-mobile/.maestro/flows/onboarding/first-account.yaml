appId: com.drifterapps.holefeeder
name: A new user adds a first account and lands in the app
tags:
  - onboarding
---
# NOT RUNNABLE YET — same blocker as the other onboarding flows: it needs the
# never-registered `e2e-new@…` user and a reset between runs.
- runFlow: ../../subflows/launch-clean.yaml

- assertVisible:
    id: 'welcome-screen'
- openLink: holefeeder://?e2e-auth-token=${MAESTRO_E2E_UNREGISTERED_TOKEN}

- runFlow:
    when:
      visible: '.*Open in .*'
    commands:
      - tapOn: '^Open$'

- extendedWaitUntil:
    visible:
      id: 'onboarding-budget-period-screen'
    timeout: 90000

- tapOn:
    id: 'onboarding-budget-period-continue-button'

- extendedWaitUntil:
    visible:
      id: 'onboarding-first-account-screen'
    timeout: 30000
- assertNotVisible:
    id: 'dashboard-screen'

# By text because the field has no id: a first account must not offer to be created
# switched off. Text is English-only here, which the simulator is.
- assertNotVisible: 'Inactive'

# The field, not the label beside it: tapping the text "Name" hits the label and the
# typing goes nowhere, which the form then rejects for a missing name.
- tapOn:
    id: 'account-name-input'
- inputText: 'Chequing'

- tapOn:
    id: 'onboarding-first-account-finish-button'

- extendedWaitUntil:
    visible:
      id: 'dashboard-screen'
    timeout: 60000
