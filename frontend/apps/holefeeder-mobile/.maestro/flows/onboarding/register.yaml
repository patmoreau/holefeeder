appId: com.drifterapps.holefeeder
name: Onboarding is asked once, not on every launch
tags:
  - onboarding
---
# Completes onboarding, then comes back: the second launch must go straight to the
# app. Registration is not something a user should be asked to do twice.
- runFlow: ../../subflows/launch-clean.yaml

- assertVisible:
    id: 'welcome-screen'
- openLink: holefeeder://?e2e-auth-token=${MAESTRO_E2E_UNREGISTERED_TOKEN}

- runFlow:
    when:
      visible: '.*Open in .*'
    commands:
      - tapOn: '^Open$'

- extendedWaitUntil:
    visible:
      id: 'onboarding-budget-period-screen'
    timeout: 90000

- tapOn:
    id: 'onboarding-budget-period-continue-button'

- extendedWaitUntil:
    visible:
      id: 'onboarding-first-account-screen'
    timeout: 30000
- tapOn:
    id: 'account-name-input'
- inputText: 'Chequing'
- tapOn:
    id: 'onboarding-first-account-finish-button'

- extendedWaitUntil:
    visible:
      id: 'dashboard-screen'
    timeout: 60000

# Same user, fresh launch: straight in, no onboarding.
- runFlow: ../../subflows/launch-clean.yaml
- assertVisible:
    id: 'welcome-screen'
- openLink: holefeeder://?e2e-auth-token=${MAESTRO_E2E_UNREGISTERED_TOKEN}
- runFlow:
    when:
      visible: '.*Open in .*'
    commands:
      - tapOn: '^Open$'

- extendedWaitUntil:
    visible:
      id: 'dashboard-screen'
    timeout: 60000
- assertNotVisible:
    id: 'onboarding-budget-period-screen'
