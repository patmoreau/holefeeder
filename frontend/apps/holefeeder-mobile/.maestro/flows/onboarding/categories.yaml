appId: com.drifterapps.holefeeder
name: A new user picks starting categories, in their language
tags:
  - onboarding
---
# run.sh wipes this user's rows before each onboarding flow.
- runFlow: ../../subflows/launch-clean.yaml

- assertVisible:
    id: 'welcome-screen'
- openLink: holefeeder://?e2e-auth-token=${MAESTRO_E2E_UNREGISTERED_TOKEN}

- runFlow:
    when:
      visible: '.*Open in .*'
    commands:
      - tapOn: '^Open$'

- extendedWaitUntil:
    visible:
      id: 'onboarding-budget-period-screen'
    timeout: 90000
- tapOn:
    id: 'onboarding-budget-period-continue-button'

- extendedWaitUntil:
    visible:
      id: 'onboarding-first-account-screen'
    timeout: 30000
- tapOn:
    id: 'account-name-input'
- inputText: 'Chequing'
- tapOn:
    id: 'onboarding-first-account-finish-button'

- extendedWaitUntil:
    visible:
      id: 'onboarding-categories-screen'
    timeout: 30000
- assertNotVisible:
    id: 'dashboard-screen'

# Everything is offered selected; dropping two proves the choice is the user's.
- tapOn:
    id: 'onboarding-category-groceries-switch'
- tapOn:
    id: 'onboarding-category-housing-switch'

- tapOn:
    id: 'onboarding-categories-finish-button'

- extendedWaitUntil:
    visible:
      id: 'dashboard-screen'
    timeout: 60000
