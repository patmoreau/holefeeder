appId: com.drifterapps.holefeeder
name: An unregistered user lands on onboarding, not the app
tags:
  - onboarding
---
# run.sh wipes this user's backend rows before each onboarding flow, so they arrive
# here as someone the backend has never seen.
- runFlow: ../../subflows/launch-clean.yaml

- assertVisible:
    id: 'welcome-screen'
- openLink: holefeeder://?e2e-auth-token=${MAESTRO_E2E_UNREGISTERED_TOKEN}

- runFlow:
    when:
      visible: '.*Open in .*'
    commands:
      - tapOn: '^Open$'

# Registering runs on arrival and hands over to the budget period, so this is where
# an unregistered caller ends up. The wait covers the register round trip.
- extendedWaitUntil:
    visible:
      id: 'onboarding-budget-period-screen'
    timeout: 90000

# The point of the batch: an unregistered caller must never reach the app.
- assertNotVisible:
    id: 'dashboard-screen'
