server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "Healthy";
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location ~ \.\w+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
