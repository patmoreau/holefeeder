name: linter

on:
  push:
    branches: [main]

  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]

concurrency:
  group: linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest

    steps:
      - name: Debug Action
        uses: hmarr/debug-action@v3

  check_changes:
    uses: patmoreau/workflow-config/.github/workflows/check-changes-action.yml@main
    with:
      file_patterns: ${{ vars.LINTER_CODE_FILE_PATTERNS }}

  csharp:
    runs-on: ubuntu-latest
    needs: check_changes
    if: ${{ needs.check_changes.outputs.code_was_changed == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./backend/global.json

      - name: Lint C# files with dotnet format
        id: lint
        continue-on-error: true
        run: dotnet format backend/DrifterApps.Holefeeder.slnx --verify-no-changes --severity error --verbosity diagnostic --report ./linter-report

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-format-report
          path: ./linter-report/*

      - name: Check for errors
        if: ${{ steps.lint.outcome != 'success' }}
        run: |
          echo "::error::dotnet format found issues in the code. Run 'dotnet format DrifterApps.Holefeeder.slnx --severity error' from backend/ and commit the result."
          exit 1

  agent_files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check generated assistant command files are in sync
        run: scripts/sync-agent-files.sh --check

  create_check:
    needs: [check_changes, csharp, typescript, agent_files]
    uses: patmoreau/workflow-config/.github/workflows/create-check.yml@main
    if: always() && needs.check_changes.result == 'success'
    with:
      code_was_changed: ${{ needs.check_changes.outputs.code_was_changed }}
      check_name: 'linter-completed'
      # Any failed or cancelled job above fails the check; otherwise carry the csharp
      # result through, which is 'skipped' when check_changes saw no code change.
      check_result: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || needs.csharp.result }}
