name: ci-cd

on:
  push:
    branches: [main]

  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io/patmoreau/holefeeder
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
  IS_PUSH_TO_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest

    steps:
      - name: Debug Action
        uses: hmarr/debug-action@v3

  check_changes:
    uses: patmoreau/workflow-config/.github/workflows/check-changes-action.yml@main
    with:
      file_patterns: ${{ vars.CICD_CODE_FILE_PATTERNS }}

  set-version:
    name: Set version
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.code_was_changed == 'true'

    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      assembly-version: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Disable workflow commands
        run: |
          echo "::stop-commands::`echo -n ${{ github.token }} | sha256sum | head -c 64`"

      - name: Ensure .NET Installed
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./backend/global.json

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: ./backend/GitVersion.yml

      - name: Display GitVersion outputs
        run: |
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"

      - name: Enable workflow commands
        run: |
          echo "::`echo -n ${{ github.token }} | sha256sum | head -c 64`::"

  build:
    name: Build
    needs: set-version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [api, web]

    env:
      VERSION: ${{ needs.set-version.outputs.version }}
      ASSEMBLY_VERSION: ${{ needs.set-version.outputs.assembly-version }}
      DOCKERFILE_PATH: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug

      - name: Set Dockerfile path
        id: dockerfile-path
        run: echo "DOCKERFILE_PATH=./backend/src/Holefeeder.${{ matrix.target == 'api' && 'Api' || 'Web' }}/Dockerfile" >> $GITHUB_ENV

      - name: Restore Docker cache for ${{ matrix.target }}
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-${{ matrix.target }}-cache
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles(env.DOCKERFILE_PATH) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-

      - name: Build ${{ matrix.target }} container
        uses: docker/build-push-action@v7
        with:
          load: true
          context: ./backend
          file: ${{ env.DOCKERFILE_PATH }}
          build-args: BUILD_VERSION=${{ env.VERSION }}
          push: false
          tags: holefeeder/holefeeder-${{ matrix.target }}:${{ env.VERSION }}
          cache-from: type=local,src=/tmp/.buildx-${{ matrix.target }}-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-${{ matrix.target }}-cache-new

      # Temp fix
      # https://github.com/docker/build-push-action/issues/252
      # https://github.com/moby/buildkit/issues/1896
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-${{ matrix.target }}-cache
          mv /tmp/.buildx-${{ matrix.target }}-cache-new /tmp/.buildx-${{ matrix.target }}-cache

      - name: Save Docker cache for ${{ matrix.target }}
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-${{ matrix.target }}-cache
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles(env.DOCKERFILE_PATH) }}

  tests:
    name: Tests
    needs: [set-version, build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [api-unit-tests, api-functional-tests]

    env:
      VERSION: ${{ needs.set-version.outputs.version }}
      ASSEMBLY_VERSION: ${{ needs.set-version.outputs.assembly-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup docker compose .env
        run: |
          printf "COMPOSE_DOCKER_CLI_BUILD=1
          DOCKER_BUILDKIT=1" > backend/.env

      - name: Restore Docker cache for api
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-api-cache
          key: ${{ runner.os }}-api-${{ hashFiles('./backend/src/Holefeeder.Api/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-api-

      - name: Restore Docker cache for web
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-web-cache
          key: ${{ runner.os }}-web-${{ hashFiles('./backend/src/Holefeeder.Web/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-web-

      - name: Running ${{ matrix.target }}
        run: |
          docker compose --env-file backend/.env -f backend/docker-compose-tests.yaml -f backend/docker-compose-tests.override.yaml run ${{ matrix.target }}

      - name: Tests cleanup
        if: always()
        run: |
          docker compose --env-file backend/.env -f backend/docker-compose-tests.yaml -f backend/docker-compose-tests.override.yaml down
          docker compose --env-file backend/.env -f backend/docker-compose-tests.yaml -f backend/docker-compose-tests.override.yaml rm --force --all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.target }}
          path: ./backend/tests-results/*.xml
          retention-days: 1

  tests-reporter:
    name: Tests reporter
    needs: [tests]
    if: always() && needs.tests.result != 'skipped'
    runs-on: ubuntu-latest

    env:
      BADGE_COLOR: ""

    steps:
      - uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          path: ./tests-results
          pattern: test-results-*
          merge-multiple: true

      - name: Test Report
        uses: dorny/test-reporter@v3
        id: test-results
        if: always()
        with:
          name: .Net Tests
          path: ./tests-results/test-results.*.xml
          reporter: dotnet-trx

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: ./tests-results/*.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Write to Job Summary
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Set badge color
        shell: bash
        run: |
          case ${{ steps.test-results.outputs.conclusion }} in
            success)
              echo "BADGE_COLOR=31c653" >> $GITHUB_ENV
              ;;
            failure)
              echo "BADGE_COLOR=800000" >> $GITHUB_ENV
              ;;
          esac

      - name: Create badge
        uses: emibcn/badge-action@v2.0.4
        with:
          label: Tests
          status: "${{ steps.test-results.outputs.passed }} passed, ${{ steps.test-results.outputs.failed }} failed, ${{ steps.test-results.outputs.skipped }} skipped: ${{ steps.test-results.outputs.conclusion }}"
          color: ${{ env.BADGE_COLOR }}
          path: holefeeder-tests-badge.svg

      - name: Upload badge to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test Results Badge
          path: |
            holefeeder-tests-badge.svg

      - name: Upload badge to Gist
        if: github.ref == 'refs/heads/main'
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: 230a77d0ee69381bbe869c0fc62f9cc6
          file_path: holefeeder-tests-badge.svg
          file_type: text

  tagging:
    needs: [set-version, tests]
    uses: patmoreau/workflow-config/.github/workflows/tag-version.yml@main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    with:
      version: ${{ needs.set-version.outputs.version }}

  publish-docker-images:
    name: Publish Docker Images
    needs: [set-version, tests, tagging]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [api, web]

    env:
      VERSION: ${{ needs.set-version.outputs.version }}
      ASSEMBLY_VERSION: ${{ needs.set-version.outputs.assembly-version }}
      DOCKERFILE_PATH: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Dockerfile path
        id: dockerfile-path
        run: echo "DOCKERFILE_PATH=./backend/src/Holefeeder.${{ matrix.target == 'api' && 'Api' || 'Web' }}/Dockerfile" >> $GITHUB_ENV

      - name: Restore Docker cache for ${{ matrix.target }}
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-${{ matrix.target }}-cache
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles(env.DOCKERFILE_PATH) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-

      - name: Publish ${{ matrix.target }} container
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ${{ env.DOCKERFILE_PATH }}
          target: final
          build-args: BUILD_VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/holefeeder-${{ matrix.target }}:${{ env.VERSION }}
          cache-from: type=local,src=/tmp/.buildx-${{ matrix.target }}-cache

  deploy:
    name: Deploy to Homelab
    needs: [set-version, tests, publish-docker-images]
    # Self-hosted runner on lxc-holefeeder (provisioned by the my-homelab github-runner role).
    runs-on: [self-hosted, holefeeder]
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.set-version.outputs.version }}
      ENVIRONMENT: Production

    environment:
      name: production

    steps:
      - uses: actions/checkout@v7
        with:
          # The self-hosted runner can retain root-owned bind-mount directories from
          # prior docker-compose deploys, which makes checkout cleanup fail before
          # the new revision is fetched.
          clean: false

      - name: Create .env file
        run: |
          cat <<EOF > backend/.env
          COMPOSE_PROJECT_NAME=holefeeder
          COMPOSE_DOCKER_CLI_BUILD=1
          DOCKER_BUILDKIT=1
          DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          VERSION=${{ env.VERSION }}
          ASSEMBLY_VERSION=${{ env.VERSION }}
          ENV=${{ env.ENVIRONMENT }}
          DOMAIN=drifterapps.app
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_APP_DB=${{ vars.POSTGRES_APP_DB }}
          POSTGRES_APP_USER=${{ vars.POSTGRES_APP_USER }}
          POSTGRES_APP_PASSWORD=${{ secrets.POSTGRES_APP_PASSWORD }}
          POWERSYNC_ADMIN_TOKEN=${{ secrets.POWERSYNC_ADMIN_TOKEN }}
          EOF

      # COMPOSE_PROFILES is intentionally unset, so the bundled reverse-proxy / adminer /
      # portainer / whoami stay down — the homelab provides ingress; logs go to stdout.

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and deploy
        run: |
          docker compose -f backend/docker-compose.yaml -f backend/docker-compose.Production.yaml pull
          docker compose -f backend/docker-compose.yaml -f backend/docker-compose.Production.yaml up -d --remove-orphans

      - name: Prune dangling images
        run: docker image prune -f

  create_check:
    needs: [check_changes, tests]
    uses: patmoreau/workflow-config/.github/workflows/create-check.yml@main
    if: always() && needs.check_changes.result == 'success'
    with:
      code_was_changed: ${{ needs.check_changes.outputs.code_was_changed }}
      check_name: "build-completed"
      check_result: ${{ needs.tests.result }}
