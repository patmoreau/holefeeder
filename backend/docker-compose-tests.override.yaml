services:
  postgres-data-test:
    expose:
      - 5432
    environment:
      - POSTGRES_DB=budgeting_tests
      - POSTGRES_USER=budgeting_tests
      - POSTGRES_PASSWORD=mypass

  api-functional-tests:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:80
    entrypoint:
      - dotnet
      - test
      - --no-restore
      - --configuration
      - Release
      - --report-trx
      - --results-directory
      - /TestResults
      - --coverage
      - --coverage-output-format
      - cobertura

  api-service-tests:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:80
    entrypoint:
      - dotnet
      - test
      - --no-restore
      - --configuration
      - Release
      - --report-trx
      - --results-directory
      - /TestResults
      - --coverage
      - --coverage-output-format
      - cobertura

  api-unit-tests:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:80
    entrypoint:
      - dotnet
      - test
      - --no-restore
      - --configuration
      - Release
      - --report-trx
      - --results-directory
      - /TestResults
      - --coverage
      - --coverage-output-format
      - cobertura
