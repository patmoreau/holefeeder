services:
  api:
    image: ${DOCKER_REGISTRY:-holefeeder}/holefeeder-api:${VERSION:-latest}
    security_opt:
      - no-new-privileges:true
    # Published on the LXC LAN IP so the homelab gateway Traefik can route to it.
    ports:
      - 5001:80

  web:
    image: ${DOCKER_REGISTRY:-holefeeder}/holefeeder-web:${VERSION:-latest}
    security_opt:
      - no-new-privileges:true
    ports:
      - 5000:80

  powersync:
    ports:
      - 8080:8080

  postgres:
    # Persist on the PBS-backed /data mount instead of a named volume.
    volumes:
      - /data/postgres:/var/lib/postgresql
